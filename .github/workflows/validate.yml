name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate repository invariants
        shell: pwsh
        run: ./scripts/validate.ps1

      - name: Dry run Codex selection
        shell: pwsh
        run: ./scripts/install.ps1 -Platform codex -IncludePackage anthropic-skills -Workspace "$env:TEMP/ucs-dryrun" -DryRun

  validate-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PowerShell 7
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https
          wget -q "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
          sudo dpkg -i packages-microsoft-prod.deb
          rm packages-microsoft-prod.deb
          sudo apt-get update
          sudo apt-get install -y powershell

      - name: Validate repository invariants
        shell: pwsh
        run: ./scripts/validate.ps1

      - name: Dry run Codex selection
        shell: pwsh
        run: ./scripts/install.ps1 -Platform codex -IncludePackage anthropic-skills -Workspace "/tmp/ucs-dryrun" -DryRun
